server {
    listen 8081;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend - Order matters! Most specific first.
    
    # Critical AREA endpoint (must be proxied)
    location = /about.json {
        proxy_pass http://server:8080/about.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning true;
    }

    # Auth routes (login, register, OAuth, etc.)
    location /auth/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning true;
    }

    # Manager routes (workflows, areas, actions, reactions)
    location /manager/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning true;
    }

    # Users routes
    location /users/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning true;
    }

    # Discord bot routes
    location /discord-bot/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning true;
    }

    # Generic /api prefix (strips /api and proxies to backend root)
    location /api/ {
        proxy_pass http://server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning true;
    }

    # Frontend routes (must be last, as catch-all)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /client.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="client.apk"';
    }

    error_page 404 /index.html;
}

